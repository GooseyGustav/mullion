name: Mullion
options:
  bundleIdPrefix: com.kyanhpham
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development: Ky Anh Pham (W99V9DN93Y)"
    DEVELOPMENT_TEAM: NZJ6XP9B66
    ENABLE_HARDENED_RUNTIME: YES

packages:
  LicenseKit:
    url: https://github.com/GooseyGustav/asifthatworks-licensekit.git
    branch: main

targets:
  Mullion:
    type: application
    platform: macOS
    sources:
      - path: Mullion
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: LicenseKit
        product: LicenseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyanhpham.mullion
        PRODUCT_NAME: Mullion
        INFOPLIST_FILE: Mullion/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        ARCHS: "$(ARCHS_STANDARD)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
